<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>HUANDENG Editor</title>
    <link rel="stylesheet" href="welcome.css" />
  </head>
  <body data-locale-ready="false">
    <main class="workspace">
      <aside class="sidebar" aria-label="项目入口" data-ui-aria="项目入口">
        <header class="brand">
          <img src="icon.svg" alt="" width="38" height="38" draggable="false" />
          <div><strong>HUANDENG</strong><span data-ui-text="幻灯编辑器">幻灯编辑器</span></div>
        </header>
        <div class="actions">
          <button type="button" id="open-project" class="primary" aria-keyshortcuts="Control+O">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v2M3 9h18l-3 11H3a1 1 0 0 1-1-1V6" /></svg>
            <span data-ui-text="打开项目">打开项目</span><kbd>Ctrl O</kbd>
          </button>
          <button type="button" id="new-project" aria-keyshortcuts="Control+N">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            <span data-ui-text="新建项目">新建项目</span><kbd>Ctrl N</kbd>
          </button>
        </div>
        <p class="project-note" data-ui-text="选择 .pptd 文件继续编辑，或为新内容建立一个项目。">选择 .pptd 文件继续编辑，或为新内容建立一个项目。</p>
        <div class="sidebar-note">
          <span class="note-rule"></span>
          <p data-ui-text="独立页面，持续演进。">独立页面，持续演进。</p>
          <span data-ui-text="编辑 · 编排 · 演示">编辑 · 编排 · 演示</span>
        </div>
        <label class="language-control">
          <span data-ui-text="界面语言">界面语言</span>
          <select id="ui-locale" aria-label="界面语言" data-ui-aria="界面语言">
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
          </select>
        </label>
      </aside>
      <div class="content">
        <header class="page-heading">
          <p class="eyebrow" data-ui-text="工作空间">工作空间</p>
          <h1 data-ui-text="继续项目">继续项目</h1>
          <p data-ui-text="打开最近的文稿，从上次的进度继续。">打开最近的文稿，从上次的进度继续。</p>
        </header>
        <section class="recents" aria-labelledby="recent-heading">
          <div class="section-heading">
            <h2 id="recent-heading"><span data-ui-text="最近项目">最近项目</span> <span id="recent-count"></span></h2>
            <span data-ui-text="最近打开">最近打开</span>
          </div>
          <div id="recent-projects" class="project-list"></div>
          <div id="empty-recents" class="empty" hidden>
            <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="8" width="34" height="26" rx="3" /><path d="M18 40h12M24 34v6M16 17h16M16 23h10" /></svg>
            <h3 data-ui-text="从第一份文稿开始">从第一份文稿开始</h3>
            <p data-ui-text="打开已有的 PPTD 项目，或新建一份空白文稿。">打开已有的 PPTD 项目，或新建一份空白文稿。</p>
            <span data-ui-text="项目会出现在这里，方便下次继续。">项目会出现在这里，方便下次继续。</span>
          </div>
        </section>
        <p id="status" class="status" role="status" aria-live="polite" data-state="idle"></p>
        <footer><span data-ui-text="文件保存在你选择的位置">文件保存在你选择的位置</span><span>HUANDENG Editor</span></footer>
      </div>
    </main>
    <script src="welcome.js"></script>
  </body>
</html>
