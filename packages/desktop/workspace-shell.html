<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>HUANDENG Editor</title>
    <link rel="stylesheet" href="workspace-shell.css" />
  </head>
  <body>
    <nav class="project-strip" aria-label="Project workspace">
      <button type="button" id="workspace-menu" class="menu" title="Application menu" aria-label="Application menu" aria-haspopup="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg></button>
      <button type="button" id="workspace-home" class="home" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8M5 10v10h5v-6h4v6h5V10" /></svg></button>
      <button type="button" id="workspace-tab-layout" class="layout-control" title="Use vertical tabs" aria-label="Use vertical tabs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" /></svg></button>
      <button type="button" id="workspace-tab-collapse" class="layout-control" title="Collapse vertical tabs" aria-label="Collapse vertical tabs" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5" /></svg></button>
      <div id="project-tabs" role="tablist" aria-label="Open Projects"></div>
      <button type="button" id="workspace-open" class="open" title="Open Project · Ctrl+O" aria-label="Open Project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></button>
      <span id="workspace-caption"></span>
      <span class="drag-space"></span>
      <span id="workspace-status" role="status" aria-live="polite"></span>
    </nav>
    <div id="tab-drop-indicator" aria-hidden="true" hidden></div>
    <script src="workspace-shell.js"></script>
  </body>
</html>
