<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUANDENG Editor</title>
    <style>
      html { background-color: #fbfaf8; }
      html.dark { background-color: #191c1b; }
    </style>
    <script>
      let stored = null;
      try { stored = localStorage.getItem('theme'); } catch {}
      const dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main-huandeng.tsx"></script>
  </body>
</html>
