name: Bug report / 问题报告
description: Report a reproducible HUANDENG Editor, plugin or export problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese are welcome. Use public or synthetic examples and remove private content from screenshots and logs.
        For a possible vulnerability, follow [SECURITY.md](https://github.com/JaytonKogeru/huandeng/blob/main/SECURITY.md) instead of posting exploit details here.
  - type: textarea
    id: summary
    attributes:
      label: Summary / 问题概述
      description: What went wrong, and which task did it prevent?
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: Entry point / 操作入口
      multiple: true
      options:
        - Desktop Editor
        - CLI / document service
        - MCP / agent plugin
        - PNG / PDF / PPTX / video export
        - Public example or documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions / 版本
      description: Editor version; plugin and host versions if relevant; source commit for a development checkout.
      placeholder: "Editor 0.19.0; plugin version; client/host version or commit"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Operating system and installation method; Node/pnpm for source builds; browser only if relevant.
      placeholder: "Windows 11; packaged desktop / source checkout; relevant client"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Name a public fixture or provide a minimal sanitized example. Do not upload a private project folder.
      placeholder: |
        1. Open or create a public example project.
        2. Select a page or object and perform the relevant action.
        3. Describe the result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: Include useful screenshots or error text after removing credentials, private paths and presentation content.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context / 补充信息
      description: Related issues, a recent version change or a workaround you tried.
